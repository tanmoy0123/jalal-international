<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- 1. Optimized Title Tag -->
    <title>Jalal International Overseas</title>

    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- 2. Added Meta Description -->
    <meta
      name="description"
      content="Jalal International Overseas offers top-tier [insert your primary services here]. Contact us today for reliable solutions."
    />

    <!-- 3. Added Open Graph Tags (For sharing on Facebook, LinkedIn, etc.) -->
    <meta property="og:title" content="Jalal International Overseas" />
    <meta
      property="og:description"
      content="Jalal International Overseas offers top-tier [insert your primary services here]."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.jalalinternationaloverseas.com/" />
    <!-- Uncomment and add your logo URL so an image appears when sharing links -->
    <meta property="og:image" content="https://www.jalalinternationaloverseas.com/favicon.png" />

    <!-- 4. Added Organization Schema Markup (JSON-LD) -->
    <script type="application/ld+json">
      [
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "Jalal International Overseas",
          "url": "https://jalalinternationaloverseas.com/",
          "logo": "https://jalalinternationaloverseas.com/favicon.png"
        },
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "Jalal International Overseas",
          "url": "https://jalalinternationaloverseas.com/"
        }
      ]
    </script>

    <link rel="icon" type="image/x-icon" href="favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <app-root></app-root>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init({
        duration: 800,
        once: true,
        offset: 100,
      });
    </script>
  </body>
</html>
